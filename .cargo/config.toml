[alias]
xtask = "run --quiet --package xtask --"

# The title needs an AVX2 CPU (README), so the host code may use what every
# AVX2 CPU has: AVX2, BMI1/2, FMA, LZCNT, MOVBE (x86-64-v3). Only the Windows
# target, so builds and tests on other hosts are unaffected.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3"]
