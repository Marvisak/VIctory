name: Apple Silicon

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: apple-silicon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Keep temporary files outside checkout
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Verify native architecture
        run: |
          test "$(uname -m)" = arm64
          rustc -Vv
          rustc -Vv | grep 'host: aarch64-apple-darwin'

      - name: Asset policy
        run: cargo xtask policy

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build release executable
        run: cargo build --workspace --release --locked

      - name: Verify Mach-O ARM64
        run: file target/release/victory | grep arm64

      - name: Synthetic offline CLI
        run: bash tests/offline-cli.sh target/release/victory
