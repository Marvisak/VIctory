name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # `test-gate` runs `cargo test` with `--jobs 1`: one test binary at a
      # time is what lets it attribute each report to the binary that wrote
      # it. That flag serializes compilation as well, so build the suite in
      # parallel here, where the 60-minute limit is, and let the gate below
      # run the already-built binaries -- it only needs their order.
      - name: Tests, build
        run: cargo test --workspace --locked --no-run
      # Runs the binaries the step above built, so nothing is compiled one
      # rustc at a time, and fails on a run that executed nothing. The suite
      # includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests, gate
        run: cargo xtask test-gate --workspace --locked
