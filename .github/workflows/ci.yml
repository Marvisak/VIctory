name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked

  # The pure crates must keep building and passing on any host, so a
  # Windows-only assumption in them shows up here rather than in a port.
  # victory-hle and the victory app do not compile off Windows yet, and
  # victory-gpu warns there about code only its Windows paths use; see the
  # lint ratchet in AGENTS.md for widening this.
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Clippy treats a module as test code only under a plain `#[cfg(test)]`;
      # `cfg(all(test, windows))` turns its helpers into library code for the
      # print/exit lints, and Linux never compiles them, so only Windows CI
      # would notice (PR #1 failed exactly that way).
      - name: Test modules use a plain cfg(test)
        shell: bash
        run: |
          if git grep -nE 'cfg\(all\(test|cfg\(all\([^)]*,\s*test' -- '*.rs'; then
            echo "::error::split into #[cfg(test)] and #[cfg(<platform>)]; see AGENTS.md, Pitfalls"
            exit 1
          fi
      - name: Check
        run: cargo check --workspace --all-targets --locked --exclude victory-hle --exclude victory
      - name: Clippy
        run: >-
          cargo clippy --workspace --all-targets --locked
          --exclude victory-hle --exclude victory --exclude victory-gpu
          -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked --exclude victory-hle --exclude victory
