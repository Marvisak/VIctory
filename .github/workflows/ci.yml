name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked

  # Titles only run on Windows, but the workspace builds and tests on Linux
  # (Wine/UMU contributors work there). This keeps the `cfg(windows)` gates
  # honest: a host-only path that leaks into shared code fails here first.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Denying warnings here is what catches an import or helper that only a
      # Windows path uses but that is not gated with it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

      - name: Asset policy
        run: cargo xtask policy

      - name: Build release executable
        run: cargo build --workspace --release --locked

      - name: Verify native ELF executable
        run: file target/release/victory | grep -E 'ELF.*x86-64'

      - name: Synthetic offline CLI
        shell: bash
        run: |
          set -o pipefail
          bash tests/offline-cli.sh target/release/victory 2>&1 | tee "$RUNNER_TEMP/offline-cli.log"

      - name: Upload synthetic test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-linux-x64
          path: ${{ runner.temp }}/offline-cli.log
          if-no-files-found: ignore
          retention-days: 7
