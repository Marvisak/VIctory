[package]
name = "victory-native-runtime"
description = "Shared native compatibility runtime for Windows title processes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "victory_native_runtime"
crate-type = ["cdylib"]

[dependencies]
victory-hle.workspace = true
victory-gpu.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }

[lints]
workspace = true
